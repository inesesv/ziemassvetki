<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ziemassvētku gaidīšana</title>
<meta name="color-scheme" content="dark">
<style>
:root{--bg:#0d1b2e;--bg2:#16304d;--ink:#f6efe0;--dim:#a9b8c9;--gold:#f2b84b;--flame:#ffd98a;--pine:#2f6b52;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{background:radial-gradient(120% 90% at 20% 10%,var(--bg2),var(--bg) 70%);color:var(--ink);
 font-family:"Fraunces",Georgia,"Times New Roman",serif;font-size:1.1vw}
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
main{position:relative;height:100%;display:grid;grid-template-columns:36% 1fr;gap:3vw;padding:3.5vw 4vw 7vw}
.left{display:flex;flex-direction:column;justify-content:flex-start;gap:3.5vw}
#branch{margin-top:-6.5vw;position:relative}#branch svg{width:100%;height:auto;display:block}
.count small{display:block;font-size:2.4em;color:var(--dim)}
.count b{display:block;font-size:12em;line-height:.95;color:var(--gold);font-weight:700;letter-spacing:-.03em}
.count span{font-size:3em}
.candles{display:flex;gap:2.2vw;align-items:flex-end;justify-content:center;height:11vw}
.c{width:3.2vw;position:relative;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.c i{display:block;width:100%;border-radius:.3vw .3vw 0 0;background:linear-gradient(90deg,#c9c1ae,#f6efe0 50%,#bdb5a2)}
.c u{position:absolute;top:0;width:1.1vw;height:2vw;border-radius:50% 50% 50% 50%/65% 65% 35% 35%;background:radial-gradient(#fff6d6,var(--flame) 45%,#e8862c);
 box-shadow:0 0 2.5vw .8vw rgba(255,190,80,.55);animation:fl 1.6s ease-in-out infinite alternate;opacity:0}
.c.on u{opacity:1}
.c.off i{opacity:.45}
.c em{position:absolute;bottom:-3vw;font-style:normal;font-size:1.5em;color:var(--dim);white-space:nowrap}
@keyframes fl{from{transform:scale(1) rotate(-3deg)}to{transform:scale(1.12,1.2) rotate(3deg)}}
.stage{position:relative;border-left:.25vw solid var(--gold);padding-left:3.5vw;display:flex;align-items:center}
.slide{position:absolute;inset:0 0 0 3.5vw;display:flex;flex-direction:column;justify-content:center;gap:1.6vw;opacity:0;transition:opacity 1.2s}
.slide.show{opacity:1}
.slide h2{font-size:3em;color:var(--gold);font-weight:600}
.slide p{font-size:4.6em;line-height:1.2;max-width:34em}
.slide ul{list-style:none;display:grid;gap:1.4vw}
.slide li{font-size:3.6em;display:flex;gap:2vw;align-items:baseline}
.slide li b{color:var(--gold);min-width:5.2em;font-weight:600}
.slide .by{font-size:2.6em;color:var(--dim)}
.bar{position:fixed;left:0;right:0;bottom:0;height:5vw;background:var(--pine);display:flex;align-items:center;padding:0 4vw;font-size:2.4em;gap:2vw;white-space:nowrap;overflow:hidden}
.bar b{color:var(--flame)}
.bar img{margin-left:auto;height:3.2vw;width:auto}
@media (max-aspect-ratio:1/1){body{font-size:2.2vw}main{grid-template-columns:1fr;padding-bottom:12vw}.stage{border-left:0;padding-left:0}.slide{inset:0}.count b{font-size:12em}}
@media (prefers-reduced-motion:reduce){.c u{animation:none}}
</style>
</head>

function dayOfYear(d){return Math.floor((day0(d)-new Date(d.getFullYear(),0,0))/864e5)}

function advents(){ // Adventes svētdienas: 4 svētdienas pirms 25. dec. (ieskaitot tuvāko pirms 24. dec.)
 var x=new Date(YEAR,11,24), dow=x.getDay(), s4=new Date(YEAR,11,24-(dow===0?7:dow)+ (dow===0?0:0));
 if(dow===0) s4=new Date(YEAR,11,24);
 else s4=new Date(YEAR,11,24-dow);
 var r=[]; for(var i=3;i>=0;i--) r.push(new Date(s4.getFullYear(),s4.getMonth(),s4.getDate()-7*i)); return r;
}

function draw(){
 var now=new Date(), today=day0(now), xmas=new Date(YEAR,11,24);
 var n=Math.round((xmas-today)/864e5), c=document.getElementById("count");
 if(n>0) c.innerHTML="<small>Līdz Ziemassvētkiem "+ending(n)+"</small><b>"+n+"</b><span>"+plural(n)+"</span>";
 else if(n===0) c.innerHTML="<small>Šodien ir</small><b style='font-size:8em'>Ziemassvētku vakars</b>";
 else c.innerHTML="<small>Skaistus svētkus!</small><b style='font-size:8em'>Priecīgus Ziemassvētkus</b>";
 var a=advents(), h="";
 a.forEach(function(d,i){
  var on=d<=today, hgt=(5+i*1.2)+"vw";
  h+='<div class="c '+(on?"on":"off")+'"><u></u><i style="height:'+hgt+'"></i></div>';
 });
 document.getElementById("candles").innerHTML=h;
}

function upcoming(){
 var today=day0(new Date());
 return EVENTS.map(function(e){return {d:new Date(YEAR,e[0]-1,e[1]),t:e[2],n:e[3]}})
  .filter(function(e){return e.d>=today}).sort(function(a,b){return a.d-b.d});
}
function label(d){return d.getDate()+". "+MONTHS[d.getMonth()].slice(0,3)+"."}

function buildSlides(){
 var now=new Date(), s=[], u=upcoming();
 s.push('<h2>Dienas labais darbs</h2><p>'+DEEDS[dayOfYear(now)%DEEDS.length]+'</p>');
 if(u.length) s.push('<h2>Tuvākie pasākumi</h2><ul>'+u.slice(0,4).map(function(e){return '<li><b>'+label(e.d)+'</b><span>'+e.n+' <i style="color:var(--dim)">'+e.t+'</i></span></li>'}).join("")+'</ul>');
 var f=FACTS[dayOfYear(now)%FACTS.length];
 s.push('<h2>'+f[0]+'</h2><p>'+f[1]+'</p>');
 var q=QUOTES[dayOfYear(now)%QUOTES.length];
 s.push('<h2>Domu grauds</h2><p>“'+q[0]+'”</p><div class="by">'+q[1]+'</div>');
 var f2=FACTS[(dayOfYear(now)+3)%FACTS.length];
 s.push('<h2>'+f2[0]+'</h2><p>'+f2[1]+'</p>');
 s.push('<h2>Klašu konkurss</h2><p>Nofotografē savas klases dekorētās durvis un nosūti skolotājai. Balsojums notiks pēdējā nedēļā.</p>');
 return s;
}

var idx=0, els=[];
function mount(){
 var st=document.getElementById("stage"); st.innerHTML=""; els=[];
 buildSlides().forEach(function(h){var d=document.createElement("div");d.className="slide";d.innerHTML=h;st.appendChild(d);els.push(d)});
 idx=0; els[0].classList.add("show");
}
function next(){
 els[idx].classList.remove("show"); idx=(idx+1)%els.length; els[idx].classList.add("show");
}

function bar(){
 var u=upcoming(), b=document.getElementById("bar");
 b.innerHTML=u.length?"<b>Nākamais:</b> "+label(u[0].d)+", "+u[0].t+" — "+u[0].n:"<b>Priecīgus svētkus!</b> Gaišu un mierīgu laiku visiem.";
}

/* sniegs */
var cv=document.getElementById("snow"), cx=cv.getContext("2d"), fl=[];
function size(){cv.width=innerWidth;cv.height=innerHeight}
function initSnow(){size();fl=[];var n=Math.round(innerWidth/14);for(var i=0;i<n;i++)fl.push({x:Math.random()*cv.width,y:Math.random()*cv.height,r:1+Math.random()*3,v:.4+Math.random()*.9,p:Math.random()*6})}
function snow(){
 cx.clearRect(0,0,cv.width,cv.height); cx.fillStyle="rgba(255,255,255,.75)";
 fl.forEach(function(f){f.y+=f.v;f.p+=.01;f.x+=Math.sin(f.p)*.4;if(f.y>cv.height){f.y=-5;f.x=Math.random()*cv.width}
  cx.beginPath();cx.arc(f.x,f.y,f.r,0,6.3);cx.fill()});
 requestAnimationFrame(snow);
}
addEventListener("resize",initSnow);

function branch(){
 var W=600,H=170,seed=11;function r(){seed=(seed*9301+49297)%233280;return seed/233280}
 var col=["#173d2f","#1f4f3c","#2b6249","#3a7d5f"],P,S,F;
 function reset(){P=["","","",""];S="";F=""}
 function f(n){return n.toFixed(1)}
 function twig(x,y,a,len,sz,pal){
  var cx=x,cy=y,ca=a;
  for(var s=3;s<len;s+=3){
   ca+=(r()-.5)*.07+(a<0?.012:-.012);cx+=Math.cos(ca)*3;cy+=Math.sin(ca)*3;
   var t=s/len,nl=(1-t*.72)*sz*(.8+r()*.4);
   [-1,1].forEach(function(d){
    var na=ca+d*(.7+r()*.35),ex=cx+Math.cos(na)*nl,ey=cy+Math.sin(na)*nl,k=Math.min(3,pal+Math.floor(r()*3));
    P[k]+="M"+f(cx)+" "+f(cy)+"L"+f(ex)+" "+f(ey);
    if(t>.5&&r()<.3)F+="M"+f(cx+Math.cos(na)*nl*.4)+" "+f(cy+Math.sin(na)*nl*.4)+"L"+f(ex)+" "+f(ey);
   });
  }
  S+="M"+f(x)+" "+f(y)+"L"+f(cx)+" "+f(cy);
 }
 function limb(y0,amp,pal,sz,n,lenMax){
  reset();var main="",x,y,t;
  for(var i=0;i<=n;i++){t=i/n;x=12+t*576;y=y0-amp*Math.sin(t*Math.PI)+Math.sin(t*9)*2;main+=(i?"L":"M")+f(x)+" "+f(y);
   if(i>0&&i<n){var e=.5+.5*Math.sin(t*Math.PI),a=(i%2?-1:1)*(.95+r()*.3)-.05;twig(x,y,a,(lenMax*.55+r()*lenMax*.45)*e,sz,pal)}}
  twig(588,y,.05,38,sz,pal);
  var o='<path d="'+main+'" fill="none" stroke="#4a3322" stroke-width="3.6" stroke-linecap="round"/><path d="'+S+'" fill="none" stroke="#4a3322" stroke-width="1.6" stroke-linecap="round"/>';
  for(var k=0;k<4;k++)if(P[k])o+='<path d="'+P[k]+'" stroke="'+col[k]+'" stroke-width="1.7" stroke-linecap="round" fill="none"/>';
  return o+'<path d="'+F+'" stroke="#e6f0ec" stroke-opacity=".55" stroke-width="1.4" stroke-linecap="round" fill="none"/>';
 }
 function cone(x,y,rot){
  var o='<g transform="translate('+x+' '+y+') rotate('+rot+')"><path d="M0 0L0 6" stroke="#4a3322" stroke-width="1.5"/><ellipse cx="0" cy="19" rx="8" ry="14" fill="#5e4029"/>';
  for(var j=0;j<6;j++)o+='<path d="M-7 '+(10+j*4.4)+'Q0 '+(15+j*4.4)+' 7 '+(10+j*4.4)+'" fill="none" stroke="#8c6a45" stroke-width="1.5"/>';
  return o+'</g>';
 }
 var o=limb(114,8,0,11,22,50)+limb(92,12,1,12,24,46);
 o+=cone(205,98,6)+cone(440,92,-8);
 [[326,86],[333,91],[321,92],[330,98],[338,84]].forEach(function(b){o+='<circle cx="'+b[0]+'" cy="'+b[1]+'" r="3.4" fill="#c8453b"/><circle cx="'+(b[0]-1)+'" cy="'+(b[1]-1)+'" r="1" fill="#fff" opacity=".5"/>'});
 document.getElementById("branch").innerHTML='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">'+o+'</svg>';
}
draw();mount();bar();branch();initSnow();
if(!matchMedia("(prefers-reduced-motion: reduce)").matches) snow();
setInterval(next,SLIDE_SECONDS*1000);
setInterval(function(){draw();bar();},60000);
setInterval(function(){location.reload()},6*3600*1000); // dienas maiņai
</script>
